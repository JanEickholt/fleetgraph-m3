# Week-4 vertical prototype demo: mock Module 1 drives robot_1 through every
# task type plus both robot-side rejection paths and an operator cancel.
# t = sim seconds after the first /clock tick. Location ids come from
# src/fleetgraph_sim/config/locations.yaml (generated by tools/gen_world.py).
robot_id: robot_1
tasks:
  - {t: 2, task_id: task-0001, type: go_to, raw_text: "Go to laboratory 1",
     locations: [lab_1]}               # straight line is blocked by the unmapped crate
  - {t: 3, task_id: task-0002, type: delivery, priority: high,
     raw_text: "Deliver a package from storage to laboratory 2",
     locations: [storage, lab_2], required_capabilities: [deliver]}
  - {t: 4, task_id: task-0003, type: go_to, raw_text: "Go to the cafeteria",
     locations: [cafeteria]}           # robot rejects: UNKNOWN_LOCATION (201)
  - {t: 5, task_id: task-0004, type: go_to, raw_text: "Bring the arm to lab 1",
     locations: [lab_1], required_capabilities: [arm]}   # MISSING_CAPABILITY (202)
  - {t: 6, task_id: task-0005, type: patrol, priority: low,
     raw_text: "Patrol the hall and the dock", locations: [hall, dock]}
  - {t: 7, task_id: task-0006, type: go_to, priority: low,
     raw_text: "Go to laboratory 1", locations: [lab_1]}   # cancelled below
# commands fire at absolute t, or after_executing_sec after the robot first
# reports EXECUTING for the task (deterministic regardless of queueing)
commands:
  - {after_executing_sec: 6, task_id: task-0006, command: cancel,
     reason: "operator cancelled"}
