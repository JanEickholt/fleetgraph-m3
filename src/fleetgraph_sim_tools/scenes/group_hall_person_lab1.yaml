name: group_hall_person_lab1
# Perception scene for 2-3 robots (tests/scenarios/weekly_perception_scenes.yaml).
# A group of two persons 0.8 m apart stands in the hall in front of the wall
# between the doors; one person stands in lab_1 beyond the lab_1 goal and
# leaves at t 80. robot_1 sees the group from the dock and as it sets off,
# the visitor through door_lab1 and from the lab_1 goal; robot_3 sees the
# group from dock_3 and from hall. Footprint clearances: the group >= 0.56 m
# from the dock -> lab_1 lines round either side of the crate, 0.64 m from
# dock_2 -> door_lab2, 1.18 m from dock_3 -> hall, 0.4 m from the wall
# behind; the visitor 1.11 m from lab_1, 0.5 m from the lab_1 / lab_2 wall,
# 0.55 m from the table.
entities:
  - id: person_1
    category: person
    label: person
    shape: {type: cylinder, radius: 0.25, height: 1.7}
    path: [{t: 0, x: 3.3, y: -0.1, yaw: -1.5708}]
  - id: person_2
    category: person
    label: person
    shape: {type: cylinder, radius: 0.25, height: 1.7}
    path: [{t: 0, x: 3.3, y: -0.9, yaw: 1.5708}]
  - id: visitor
    category: person
    label: person
    shape: {type: cylinder, radius: 0.25, height: 1.7}
    remove: 80
    path: [{t: 0, x: 7.3, y: 0.8, yaw: 3.1416}]
  - id: crate                     # in the world SDF, unknown to the static map
    category: obstacle
    label: crate
    shape: {type: box, size: [0.4, 0.4, 0.5]}
    preexisting: true
    path: [{t: 0, x: 2.5, y: 0.8}]
